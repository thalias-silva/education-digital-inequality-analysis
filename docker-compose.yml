services:
  minio:
    image: minio/minio
    container_name: minio_local
    ports:
      - "9000:9000"  # Porta da API (Python/DuckDB)
      - "9002:9001"  # Porta do Console (Navegador)

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    volumes:
      - minio_data:/data

    command: server /data --console-address ":9001"

volumes:
  minio_data: